name: Update profile art
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: profile-art
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: Alok200336
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/render_stats_svg.py
      - name: Save refreshed art
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json contrib-heatmap.svg stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile art [skip ci]"
            git push
          fi
